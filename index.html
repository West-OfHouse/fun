<!DOCTYPE html>

<html>

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
	>

	<link
		rel="stylesheet"
		type="text/css"
		href="website1.css"
	>

</head>


<body>

	<div id="scoreboard">

		<span id="leftScore">0</span>

		<span id="scoreDivider">:</span>

		<span id="rightScore">0</span>

	</div>


	<div id="countdown"></div>


	<div id="left" class="paddle">

		<img
			src="chicken.png"
			class="chicken"
			draggable="false"
		>

	</div>


	<div id="right" class="paddle">

		<img
			src="chicken.png"
			class="chicken"
			draggable="false"
		>

	</div>


	<img
		src="ball.png"
		id="ball"
		draggable="false"
	>


	<script src="website1.js"></script>

</body>

</html>

<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link rel="stylesheet" type="text/css" href="website1.css">
</head>

<body>

	<div id="scoreboard">
		<span id="leftScore">0</span>
		<span id="scoreDivider">:</span>
		<span id="rightScore">0</span>
	</div>

	<div id="countdown"></div>


	<div id="left" class="paddle">
		<img src="chicken.png" class="chicken">
	</div>

	<div id="right" class="paddle">
		<img src="chicken.png" class="chicken">
	</div>


	<img src="ball.png" id="ball">


	<!-- MOBILE TOUCH CONTROLS -->

	<div id="leftUp" class="touchZone">
		<div class="touchLabel">▲</div>
	</div>

	<div id="leftDown" class="touchZone">
		<div class="touchLabel">▼</div>
	</div>

	<div id="rightUp" class="touchZone">
		<div class="touchLabel">▲</div>
	</div>

	<div id="rightDown" class="touchZone">
		<div class="touchLabel">▼</div>
	</div>


	<script type="text/javascript" src="website1.js"></script>

</body>

</html>
